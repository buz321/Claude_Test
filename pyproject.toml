[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.1.0"
description = "미국 주식을 위한 기술적/기본적/종합 점수 분석 라이브러리"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "buz321" }]
keywords = ["stock", "analysis", "technical", "fundamental", "finance"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["stock_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
