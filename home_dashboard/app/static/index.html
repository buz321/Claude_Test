<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="집안일 · 장보기 · 일정을 가족이 함께 보는 우리집 대시보드">
  <title>우리집 대시보드</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.2v-5.6H9.2V20H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="ic-tasks" viewBox="0 0 24 24"><path d="M4 7.4 5.6 9 8.6 6M4 15.4 5.6 17l3-3M12 7.5h8M12 15.5h8"/></symbol>
    <symbol id="ic-cart" viewBox="0 0 24 24"><path d="M3 4.5h2.2l2.1 10.4h10.2l1.9-7.9H7.5"/><circle cx="9.6" cy="19" r="1.5"/><circle cx="16.8" cy="19" r="1.5"/></symbol>
    <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M8 3.5v4M16 3.5v4M3.5 10.5h17"/></symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="ic-bell" viewBox="0 0 24 24"><path d="M12 3.8a5.4 5.4 0 0 0-5.4 5.4c0 4.8-2 6.3-2 6.3h14.8s-2-1.5-2-6.3A5.4 5.4 0 0 0 12 3.8z"/><path d="M10.4 18.7a1.9 1.9 0 0 0 3.2 0"/></symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 14.3A8.4 8.4 0 0 1 9.7 4a8.4 8.4 0 1 0 10.3 10.3z"/></symbol>
    <symbol id="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.6 9.6 17 19 7.4"/></symbol>
    <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.1 2"/></symbol>
    <symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M4.5 10.2A5 5 0 0 1 9.5 5.2h9.8M16.4 2.4l3 2.8-3 2.8M19.5 13.8a5 5 0 0 1-5 5H4.7M7.6 21.6l-3-2.8 3-2.8"/></symbol>
    <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.6"/><path d="M5.4 20a6.8 6.8 0 0 1 13.2 0"/></symbol>
    <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 21.2s6.4-6.2 6.4-10.6a6.4 6.4 0 1 0-12.8 0C5.6 15 12 21.2 12 21.2z"/><circle cx="12" cy="10.4" r="2.4"/></symbol>
    <symbol id="ic-alert" viewBox="0 0 24 24"><path d="M12 4.2 3.2 19.8h17.6z"/><path d="M12 10v4.2M12 17.4v.2"/></symbol>
    <symbol id="ic-flame" viewBox="0 0 24 24"><path d="M12 3.2s5.2 3.9 5.2 8.2a5.2 5.2 0 0 1-10.4 0c0-1.7 1-3.1 1-3.1s.4 2 1.9 2c0-3.1 2.3-5.1 2.3-7.1z"/></symbol>
    <symbol id="ic-note" viewBox="0 0 24 24"><path d="M6 4.5h12v15H6z"/><path d="M9 9h6M9 12.5h6M9 16h3.5"/></symbol>
    <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4.6 7h14.8M9.6 7V4.6h4.8V7M6.8 7l.9 13h8.6l.9-13"/></symbol>
    <symbol id="ic-inbox" viewBox="0 0 24 24"><path d="M4 13.6 6.6 5h10.8L20 13.6V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13.6h4.2l1 2.6h5.6l1-2.6H20"/></symbol>
    <symbol id="ic-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M8.2 12.2 11 15l5-5.4"/></symbol>
    <symbol id="ic-sofa" viewBox="0 0 24 24"><path d="M4.5 11V8.2a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2V11"/><path d="M3 13.4a2 2 0 0 1 4 0v2.2h10v-2.2a2 2 0 0 1 4 0V19H3z"/></symbol>
    <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  </svg>

  <div class="ptr" id="ptr"><span class="ptr-ring"></span></div>

  <!-- 사이트 헤더 -->
  <header class="topbar">
    <div class="bar">
      <div class="brand">
        <span class="mark"><svg class="ic"><use href="#ic-home"/></svg></span>
        <span class="wordmark">우리집</span>
      </div>

      <nav class="nav" id="nav" aria-label="주요 메뉴">
        <button class="nav-item active" data-tab="today"><svg class="ic"><use href="#ic-home"/></svg><span>오늘</span></button>
        <button class="nav-item" data-tab="tasks"><svg class="ic"><use href="#ic-tasks"/></svg><span>할일</span><i class="dot" id="dot-tasks"></i></button>
        <button class="nav-item" data-tab="shopping"><svg class="ic"><use href="#ic-cart"/></svg><span>장보기</span><i class="dot" id="dot-shopping"></i></button>
        <button class="nav-item" data-tab="events"><svg class="ic"><use href="#ic-calendar"/></svg><span>일정</span></button>
      </nav>

      <div class="bar-actions">
        <span class="datestamp num" id="top-date">—</span>
        <button class="ghost-btn" id="btn-theme" aria-label="테마 바꾸기">
          <svg class="ic"><use href="#ic-moon" id="theme-icon"/></svg>
        </button>
        <button class="primary-btn" id="btn-add">
          <svg class="ic"><use href="#ic-plus"/></svg><span>추가</span>
        </button>
      </div>
    </div>
  </header>

  <div class="page">
    <main class="content" id="main">
      <section class="view active" id="view-today"></section>
      <section class="view" id="view-tasks"></section>
      <section class="view" id="view-shopping"></section>
      <section class="view" id="view-events"></section>
    </main>

    <!-- 사이드바 -->
    <aside class="rail">
      <section class="panel">
        <p class="eyebrow" id="greet">안녕하세요</p>
        <div class="progress-main">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 72 72" aria-hidden="true">
              <circle class="ring-bg" cx="36" cy="36" r="31"></circle>
              <circle class="ring-fg" id="ring-fg" cx="36" cy="36" r="31"></circle>
            </svg>
            <span class="ring-pct num" id="ring-pct">0%</span>
          </div>
          <div class="progress-text">
            <strong id="progress-head">오늘의 집안일</strong>
            <span id="progress-sub">불러오는 중</span>
          </div>
        </div>
        <div class="chips" id="hero-chips"></div>
      </section>

      <section class="panel notify-panel">
        <h3 class="panel-title">알림</h3>
        <p class="panel-text" id="notify-desc">매일 아침 요약과 마감·일정 알림을 폰으로 보냅니다.</p>
        <button class="wide-btn" id="btn-notify">
          <svg class="ic" id="bell"><use href="#ic-bell"/></svg><span>지금 요약 보내기</span>
        </button>
      </section>
    </aside>
  </div>

  <footer class="foot">
    <span>우리집 대시보드</span>
    <span class="sep">·</span>
    <span>라즈베리파이 로컬 서버</span>
    <span class="sep">·</span>
    <span>알림 <b id="foot-notifier">—</b></span>
    <span class="sep">·</span>
    <a href="/docs" target="_blank" rel="noopener">API 문서</a>
  </footer>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
