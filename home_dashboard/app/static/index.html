<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>우리집</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 당겨서 새로고침 -->
  <div class="ptr" id="ptr"><div class="ptr-ring"></div></div>

  <header class="hero" id="hero">
    <div class="hero-glow"></div>
    <div class="hero-inner">
      <div class="hero-row">
        <div class="hero-title">
          <p class="greet" id="greet">안녕하세요</p>
          <h1 id="hero-date">—</h1>
        </div>
        <div class="hero-btns">
          <button class="icon-btn" id="btn-theme" aria-label="테마 바꾸기">
            <span class="icon-swap" id="theme-icon">☾</span>
          </button>
          <button class="icon-btn" id="btn-notify" aria-label="알림 보내기">
            <span id="bell">🔔</span>
          </button>
        </div>
      </div>

      <div class="progress-card" id="progress-card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
            <circle class="ring-bg" cx="40" cy="40" r="34"></circle>
            <circle class="ring-fg" id="ring-fg" cx="40" cy="40" r="34"></circle>
          </svg>
          <span class="ring-pct" id="ring-pct">0%</span>
        </div>
        <div class="progress-text">
          <strong id="progress-head">오늘의 집안일</strong>
          <span id="progress-sub" class="muted">불러오는 중…</span>
          <div class="chips" id="hero-chips"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="view active" id="view-today"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-shopping"></section>
    <section class="view" id="view-events"></section>
  </main>

  <button class="fab" id="fab" aria-label="새로 추가">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>오늘</span>
    </button>
    <button class="tab" data-tab="tasks">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3 7-7"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      <span>할일</span>
      <i class="dot" id="dot-tasks"></i>
    </button>
    <button class="tab" data-tab="shopping">
      <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6L5 3H2"/></svg>
      <span>장보기</span>
      <i class="dot" id="dot-shopping"></i>
    </button>
    <button class="tab" data-tab="events">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
      <span>일정</span>
    </button>
    <span class="tab-ink" id="tab-ink"></span>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
